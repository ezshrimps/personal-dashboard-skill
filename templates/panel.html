    const trLines = (st.trackers || []).map(x => [x.name, x.kind, x.unit || '', x.goal || '', x.period || 'day'].join(', ')).join('\n');
    return `<div class="grid">
      <section class="card sz-l"><div class="card-h"><h2>${esc(t('s_layout'))}</h2></div><div class="hint" style="margin-bottom:8px">${esc(t('s_layout_h'))}</div><div class="set-sec">${pageBlocks}</div></section>
      <section class="card"><div class="card-h"><h2>${esc(t('s_basic'))}</h2></div><div class="formgrid">
        <label>${esc(t('name'))}<input class="field" id="setName" value="${esc(st.profile.name)}"></label>
        <label>${esc(t('lang'))}<input class="field" id="setLang" value="${esc(st.locale.lang)}"></label>
        <label>${esc(t('currency'))}<input class="field" id="setCur" value="${esc(st.locale.currency)}"></label>
        <label>${esc(t('weekStartL'))}<select class="field" id="setWs"><option value="1" ${st.locale.weekStart !== 0 ? 'selected' : ''}>${esc(t('mon'))}</option><option value="0" ${st.locale.weekStart === 0 ? 'selected' : ''}>${esc(t('sun'))}</option></select></label>
        <label>${esc(t('scale'))}<select class="field" id="setScale">${[1, 1.15, 1.3].map(v => `<option value="${v}" ${+st.ui.scale === v ? 'selected' : ''}>${Math.round(v * 100)}%</option>`).join('')}</select></label>
        <label>${esc(t('monthBudget'))}<input class="field" type="number" id="setBudget" value="${+st.budget || ''}"></label>
        <label>${esc(t('gymGoal'))}<input class="field" type="number" id="setGym" value="${+st.goals.workout || ''}"></label>
        <label>${esc(t('proteinGoal'))}<input class="field" type="number" id="setProt" value="${+st.food.protein || ''}"></label>
        <label>${esc(t('kcalGoal'))}<input class="field" type="number" id="setKcal" value="${+st.food.kcal || ''}"></label>
        <label>${esc(t('weightUnit'))}<input class="field" id="setWU" value="${esc(st.weightUnit)}"></label>
        <label>${esc(t('bankQ'))}<input class="field" id="setBank" value="${esc(st.bank.query)}" placeholder="from:alerts@yourbank.com"></label>
      </div><label class="hint" style="display:block;margin-top:10px">${esc(t('about'))}<textarea class="field" id="setAbout" rows="3">${esc(st.profile.about)}</textarea></label></section>
      <section class="card"><div class="card-h"><h2>${esc(t('s_checks'))}</h2></div><div class="hint">${esc(t('s_checks_h'))}</div><textarea class="field" id="setChecks" rows="5">${esc(st.checks.filter(c => c.n).map(c => `${c.n}, ${c.goal || 7}`).join('\n'))}</textarea>
        <h3 style="font-size:14px">${esc(t('s_trackers'))}</h3><div class="hint">${esc(t('s_trackers_h'))}</div><textarea class="field" id="setTrackers" rows="5">${esc(trLines)}</textarea>
        <h3 style="font-size:14px">${esc(t('s_cats'))}</h3><div class="hint">${esc(t('s_cats_h'))}</div><textarea class="field" id="setCats" rows="6">${esc(cats().map(c => `${c.n}${+c.budget ? ', ' + c.budget : ''}`).join('\n'))}</textarea>
        <h3 style="font-size:14px">${esc(t('s_workouts'))}</h3><textarea class="field" id="setWorkouts" rows="3">${esc(st.workouts.join('\n'))}</textarea>
        <h3 style="font-size:14px">${esc(t('s_rotation'))}</h3><textarea class="field" id="setRot" rows="3">${esc(st.rotation.join('\n'))}</textarea></section>
      <section class="card sz-l"><div class="card-h"><h2>${esc(t('s_sched'))}</h2><span class="hint">${esc(t('schedHint'))}</span></div><div class="formgrid">${[0, 1, 2, 3, 4, 5, 6].map(i => `<label>${esc(wdName(i))}<textarea class="field" id="tpl-${i}" data-tpl="${i}" rows="6">${esc(st.templates[i])}</textarea></label>`).join('')}</div></section>
      <section class="card"><div class="card-h"><h2>${esc(t('conn'))}</h2></div><div class="list"><div class="li"><span class="w">Claude</span><span class="m">${esc(t(S.sample ? 'ok' : 'off'))}</span></div><div class="li"><span class="w">Google Calendar</span><span class="m">${esc(t(S.conn.cal === 'ok' ? 'ok' : 'off'))}</span></div><div class="li"><span class="w">Gmail</span><span class="m">${esc(t(S.mcp ? 'ok' : 'off'))}</span></div></div>
        <button class="pill" style="margin-top:12px" data-act="saveSettings">${esc(t('save'))}</button></section></div>`;
  }
  const slug = (s, i) => (String(s).toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 12) || 'x') + (i != null ? i : '');
  async function collectSettings() {
    const st = S.settings, v = id => $('#' + id).value.trim();
    const lines = id => $('#' + id).value.split('\n').map(l => l.trim()).filter(Boolean);
    const oldChecks = st.checks;
    const checks = lines('setChecks').map((l, i) => { const [n, g] = l.split(/[,，]/).map(x => x.trim()); const old = oldChecks.find(c => c.n === n); return { k: old ? old.k : 'c' + slug(n, i), n, goal: Math.max(1, Math.min(7, +g || 7)) }; });
    const trackers = lines('setTrackers').map((l, i) => { const [name, kind, unit, goal, period] = l.split(/[,，]/).map(x => x.trim()); const old = (st.trackers || []).find(x => x.name === name);
      return { id: old ? old.id : 't' + slug(name, i) + Date.now().toString(36).slice(-3), name, kind: ['count', 'number', 'check', 'rating', 'list'].includes(kind) ? kind : 'count', unit: unit || '', goal: +goal || 0, period: ['day', 'week', 'month'].includes(period) ? period : 'day', chart: old ? old.chart || 'bar' : 'bar' }; });
    const oldCats = cats();
    const catsNew = lines('setCats').map((l, i) => { const [n, b] = l.split(/[,，]/).map(x => x.trim()); const old = oldCats.find(c => c.n === n); return { k: old ? old.k : 'c' + slug(n, i), n, budget: +b || 0 }; });
    // New trackers start on the first page; removed ones drop out of every page.
    const tids = new Set(trackers.map(x => 'tracker:' + x.id)); const pages = structuredClone(st.layout.pages);
    pages.forEach(p => { p.blocks = p.blocks.filter(id => !id.startsWith('tracker:') || tids.has(id)); });
    trackers.filter(x => !(st.trackers || []).some(o => o.id === x.id)).forEach(x => pages[0].blocks.push('tracker:' + x.id));
    const templates = [0, 1, 2, 3, 4, 5, 6].map(i => document.querySelector(`[data-tpl="${i}"]`).value.trim());
    if (await saveSettings({
      profile: { name: v('setName'), about: v('setAbout') }, locale: { ...st.locale, lang: v('setLang') || 'zh', currency: (v('setCur') || 'USD').toUpperCase(), weekStart: +$('#setWs').value }, ui: { scale: +$('#setScale').value || 1 },
      budget: +v('setBudget') || 0, goals: { ...st.goals, workout: +v('setGym') || 0 }, food: { protein: +v('setProt') || 0, kcal: +v('setKcal') || 0 }, weightUnit: v('setWU') || 'kg', bank: { query: v('setBank') },
      checks, trackers, cats: catsNew, workouts: lines('setWorkouts'), rotation: lines('setRot'), templates, layout: { ...st.layout, pages },
    })) toast(t('saved'));
  }
  async function moveBlock(pi, id, op) {
    const pages = structuredClone(S.settings.layout.pages); const b = pages[pi].blocks; const i = b.indexOf(id);
    if (op === 'toggle') { if (i >= 0) b.splice(i, 1); else b.push(id); }
    else if (i >= 0) { const j = op === 'up' ? i - 1 : i + 1; if (j < 0 || j >= b.length) return; [b[i], b[j]] = [b[j], b[i]]; }
    await saveSettings({ layout: { ...S.settings.layout, pages } });
  }

  // ================= render =================
  const pageName = pg => pg.name || t(pg.id) || pg.id;
  const navPages = () => [...S.settings.layout.pages.map(p => ({ id: p.id, n: pageName(p) })), { id: 'settings', n: t('settings') }];
  function render() {
    if (S.mcp && calWeek !== weekStart(S.sel)) loadCal();
    document.documentElement.lang = lang() === 'zh' ? 'zh-CN' : lang();
    $('#app').style.zoom = +S.settings.ui.scale || 1;
    $('#brandName').textContent = CFG.title || S.settings.profile.name || 'daily';
    $('#datePill').textContent = S.sel === todayStr() ? `${t('today')} · ${fmtDate(S.sel)}` : fmtDate(S.sel);
    const nav = navPages(); if (!nav.some(p => p.id === S.page)) S.page = nav[0].id;
    const tabs = nav.map(p => `<button class="tab" role="tab" data-act="page" data-id="${esc(p.id)}" aria-selected="${p.id === S.page}">${esc(p.n)}</button>`).join('');
    $('#tabsDesk').innerHTML = tabs; $('#tabsMob').innerHTML = tabs;
    const main = $('#main');
    // Keep what the user is typing across live re-renders.
    const keep = {}; main.querySelectorAll('input[id], textarea[id]').forEach(el => { if (el.type !== 'file') keep[el.id] = el.value; });
    const focus = document.activeElement && document.activeElement.id;
    if (S.page === 'settings') { if (!main.dataset.settings || S.reSettings) { main.innerHTML = renderSettings(); main.dataset.settings = '1'; S.reSettings = false; } }
    else {
      delete main.dataset.settings;
      const pg = S.settings.layout.pages.find(p => p.id === S.page);
      main.innerHTML = `<div class="grid">${pg.blocks.map(id => { const b = blockDef(id); if (!b) return '';
        let body = ''; try { body = b.render(); } catch (e) { console.warn(id, e); body = `<div class="empty">—</div>`; }
        return `<section class="card sz-${b.size || 'm'} ${b.edge ? 'edge' : ''}" data-block="${esc(id)}">${id === 'now' ? '' : `<div class="card-h"><h2>${esc(blockName(id))}</h2></div>`}${body}</section>`; }).join('')}</div>`;
    }
    Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el && v) el.value = v; });
    if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); if (el.setSelectionRange && typeof el.value === 'string') el.setSelectionRange(el.value.length, el.value.length); } }
  }

  // ================= events =================
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT' && b.type === 'file' || b.tagName === 'SELECT') return;
    const act = b.dataset.act, id = b.dataset.id;
    if (act === 'page') { S.page = id; window.scrollTo(0, 0); render(); }
    else if (act === 'entry') { const v = ($('#qeIn').value || '').trim(); if (v) planEntry(v); }
    else if (act === 'runParsed') runActions();
    else if (act === 'dropParsed') { S.parsed = null; render(); }
    else if (act === 'toggleAct') { S.parsed.actions[+b.dataset.i].off = !b.checked; }
    else if (act === 'addTodo') { const v = $('#todoIn').value.trim(); if (!v) return; $('#todoIn').value = ''; const tid = await addTodo({ text: v }); if (tid) toast(t('recorded') + v, () => write(db => db.doc('todos/' + tid).delete())); }
    else if (act === 'doneTodo') { const u = await completeTodo(S.todos.find(x => x.id === id)); if (u) toast('✓', u); }
    else if (act === 'delTodo') { const x = S.todos.find(y => y.id === id); const copy = Object.fromEntries(Object.entries(x).filter(([k]) => k !== 'id')); if (await write(db => db.doc('todos/' + id).delete())) toast(t('del') + ' ' + x.text, () => write(db => db.doc('todos/' + id).set(copy))); }
    else if (act === 'check') { const k = b.dataset.k; saveDay(S.sel, d => { d.checks[k] = !d.checks[k]; }); }
    else if (act === 'workout') { const w = b.dataset.w; saveDay(S.sel, d => { const i = d.workouts.findIndex(x => x.type === w); if (i >= 0) d.workouts.splice(i, 1); else d.workouts.push({ type: w, mins: null }); }); }
    else if (act === 'delFood') saveDay(S.sel, d => { d.food.splice(+b.dataset.i, 1); });
    else if (act === 'sleepNow' || act === 'wakeNow') { const u = await sleepTap(act === 'sleepNow' ? 'bed' : 'wake'); if (u) toast(t(act), u); }
    else if (act === 'editSched') { S.editSched = S.sel; render(); }
    else if (act === 'cancelSched') { S.editSched = null; render(); }
    else if (act === 'saveSched') { const v = $('#schedEd').value; S.editSched = null; saveDay(S.sel, d => { d.override = parseSched(v).map(schedLine).join('\n'); }); }
    else if (act === 'catTxn') { const patch = b.dataset.k === 'ignore' ? { ignored: true } : { cat: b.dataset.k }; if (await write(db => db.doc('expenses/' + id).update(patch))) toast(t('saved'), () => write(db => db.doc('expenses/' + id).update({ cat: '', ignored: false }))); }
    else if (act === 'delExp') { const x = S.expenses.find(y => y.id === id); const copy = Object.fromEntries(Object.entries(x).filter(([k]) => k !== 'id')); if (await write(db => db.doc('expenses/' + id).delete())) toast(t('del'), () => write(db => db.doc('expenses/' + id).set(copy))); }
    else if (act === 'delRec') write(db => db.doc('recurring/' + id).delete());
    else if (act === 'delInc') write(db => db.doc('income/' + id).delete());
    else if (act === 'delEntry') write(db => db.doc('entries/' + id).delete());
    else if (act === 'syncBank') syncBank();
    else if (act === 'togglePaste') { S.showPaste = !S.showPaste; render(); }
    else if (act === 'importPaste') importPaste($('#pasteIn').value);
    else if (act === 'analyze') analyzeMonth();
    else if (act === 'doneDl') write(db => db.doc('deadlines/' + id).update({ done: true }));
    else if (act === 'delDl') write(db => db.doc('deadlines/' + id).delete());
    else if (act === 'saveReview') { const wid = weekStart(S.sel); const body = Object.fromEntries([...document.querySelectorAll('[data-rv]')].map(x => [x.dataset.rv, x.value.trim()])); if (await write(db => db.doc('reviews/' + wid).set({ ...body, at: new Date().toISOString() }))) toast(t('saved')); }
    else if (act === 'trk') { const u = await trackWrite(trackerById(id), S.sel, +b.dataset.v); if (u) render(); }
    else if (act === 'trkSet' || act === 'trkAdd') { const inp = document.querySelector(`[data-trkin="${id}"]`); const v = inp.value.trim(); if (!v) return; inp.value = ''; const u = await trackWrite(trackerById(id), S.sel, act === 'trkSet' ? +v : v, 'set'); if (u) toast(t('saved'), u); }
    else if (act === 'trkCheck') trackWrite(trackerById(id), S.sel, entryVal(id, S.sel) > 0 ? 0 : 1, 'set');
    else if (act === 'trkRate') trackWrite(trackerById(id), S.sel, +b.dataset.v, 'set');
    else if (act === 'blkUp' || act === 'blkDown') moveBlock(+b.dataset.p, id, act === 'blkUp' ? 'up' : 'down');
    else if (act === 'saveSettings') collectSettings();
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.act === 'photo' && el.files && el.files[0]) photoEntry(el.files[0]);
    else if (el.dataset.act === 'blkToggle') moveBlock(+el.dataset.p, el.dataset.id, 'toggle');
    else if (el.dataset.act === 'jobStatus') write(db => db.doc('jobs/' + el.dataset.id).update({ status: el.value, updated_at: new Date().toISOString() }));
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'qeIn') { e.preventDefault(); const v = e.target.value.trim(); if (v) planEntry(v); }
    else if (e.key === 'Enter' && e.target.id === 'todoIn') document.querySelector('[data-act="addTodo"]').click();
  });
  $('#prevDay').onclick = () => { S.sel = addDays(S.sel, -1); subscribeMonth(); render(); };
  $('#nextDay').onclick = () => { S.sel = addDays(S.sel, 1); subscribeMonth(); render(); };
  $('#datePill').onclick = () => { S.sel = todayStr(); subscribeMonth(); render(); };

  // ================= data =================
  const onSubErr = e => { if (e && (e.code === 'revoked' || e.code === 'unavailable')) showBanner(t('noDb')); else console.warn('db', e); };
  let unsubMonth = null, subMonthKey = null;
  function subscribeMonth() {
    if (!S.db) return; const mo = monthOf(S.sel); if (mo === subMonthKey) return;
    if (unsubMonth) unsubMonth(); subMonthKey = mo;
    unsubMonth = S.db.collection('expenses').where('month', '==', mo).onSnapshot(snap => { S.expenses = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, onSubErr);
  }
  const sub = (q, fn) => q.onSnapshot(snap => { fn(snap.docs.map(d => ({ id: d.id, ...d.data() }))); render(); }, onSubErr);
  async function connect() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
    if (!db) { showBanner(t('noDb')); render(); return; }
    S.db = db;
    db.doc('settings/main').onSnapshot(snap => { S.settings = mergeSettings(snap.exists ? snap.data() : {}); render(); }, onSubErr);
    db.collection('days').orderBy('date', 'desc').limit(400).onSnapshot(snap => { const next = {}; snap.docs.forEach(d => { next[d.id] = d.data(); }); Object.keys(dirty).forEach(k => { if (S.days[k]) next[k] = S.days[k]; }); S.days = next; render(); }, onSubErr);
    sub(db.collection('todos').where('done', '==', false), l => { S.todos = l; });
    sub(db.collection('todos').where('done', '==', true).orderBy('doneAt', 'desc').limit(50), l => { S.doneTodos = l; });
    sub(db.collection('events'), l => { S.events = l; });
    sub(db.collection('sleeps').orderBy('bed', 'desc').limit(120), l => { S.sleeps = l; });
    sub(db.collection('expenses').where('src', '==', 'bank').where('cat', '==', ''), l => { S.bankPending = l; });
    sub(db.collection('recurring'), l => { S.recurring = l; });
    sub(db.collection('income'), l => { S.income = l; });
    sub(db.collection('savgoals'), l => { S.savgoals = l; });
    sub(db.collection('deadlines'), l => { S.deadlines = l; });
    sub(db.collection('jobs'), l => { S.jobs = l; });
    sub(db.collection('entries').orderBy('date', 'desc').limit(1000), l => { S.entries = l; });
    db.collection('insights').onSnapshot(snap => { S.insights = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); render(); }, onSubErr);
    db.collection('reviews').onSnapshot(snap => { S.reviews = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); render(); }, onSubErr);
    db.collection('sync').onSnapshot(snap => { S.sync = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); }, onSubErr);
    subscribeMonth();
    try { S.sample = await window.claude.use('sample'); } catch { S.sample = null; }
    if (S.sample && S.sample.limits) { const lim = await S.sample.limits().catch(() => null); S.imgOK = !!(lim && lim.images); }
    try { S.mcp = await window.claude.use('mcp'); } catch { S.mcp = null; }
    render();
    if (S.mcp) { loadCal(); setInterval(() => { if (!document.hidden) loadCal(true); }, 10 * 60e3); }
  }

  let lastToday = todayStr();
  setInterval(() => { const td = todayStr(); if (td !== lastToday) { if (S.sel === lastToday) S.sel = td; lastToday = td; subscribeMonth(); } if (S.page !== 'settings') render(); }, 60e3);
  render();
  connect();
})();
</script>
